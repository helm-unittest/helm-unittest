name: "unittest"
version: "2.0.0"
apiVersion: v1
type: cli/v1
runtime: subprocess
config:
  usage: "unittest [flags] CHART [...]"
  shortHelp: "unittest for helm charts"
  longHelp: "Unit test for helm chart in YAML with ease to keep your chart functional and robust."
  ignoreFlags: false
runtimeConfig:
  platformCommand:
    - command: "$HELM_PLUGIN_DIR/untt"
    - os: windows
      command: "$HELM_PLUGIN_DIR\\untt.exe"
  platformHooks:
    install:
      - command: "$HELM_PLUGIN_DIR/install-binary.sh"
      - os: windows
        command: "powershell.exe"
        args:
          - -ExecutionPolicy
          - Bypass
          - -File
          - "$HELM_PLUGIN_DIR\\install-binary.ps1"
    update:
      - command: "$HELM_PLUGIN_DIR/install-binary.sh"
      - os: windows
        command: "powershell.exe"
        args:
          - -ExecutionPolicy
          - Bypass
          - -File
          - "$HELM_PLUGIN_DIR\\install-binary.ps1"
