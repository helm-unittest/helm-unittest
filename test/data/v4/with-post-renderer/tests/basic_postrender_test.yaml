templates:
  - templates/basic.yaml
postRenderer:
  plugin: "annotation-tester"
  args:
    - "eval"
    - '.metadata.annotations.appended="new"'
    - "-"
tests:
  - it: manifest should match snapshot
    asserts:
      - matchSnapshot: {}
  - it: manifest should include an extra annotation due to suite annotation-tester post-renderer
    asserts:
      - equal:
          path: metadata.annotations.foo
          value: bar
      - equal:
          path: metadata.annotations.appended
          value: new
  - it: manifest should overwrite existing annotation due to test-job annotation-tester post-renderer
    postRenderer:
      plugin: "annotation-tester"
      args:
        - "eval"
        - '.metadata.annotations.foo="baz"'
        - "-"
    asserts:
      - equal:
          path: metadata.annotations.foo
          value: baz
      # never added by the suite yq because it was overridden in the job
      - notExists:
          path: metadata.annotations.appended
