templates:
  - templates/lookup_secret.yaml
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: "v1"
        resource: "secrets"
      namespaced: true
  objects:
    - kind: Secret
      apiVersion: v1
      metadata:
        name: mock-secret
        namespace: default
      data:
        encoded: ZW5jb2RlZCB2YWx1ZQ==
        overridden: b2xkIHZhbHVl
      stringData:
        plain: plain value
        overridden: new value
tests:
  - it: should base64 encode stringData into data, like the api-server does
    asserts:
      - matchSnapshot: {}
      - equal:
          path: stringData
          value:
            from_string_data: plain value
            from_data: encoded value
            overridden: new value
            string_data_is_dropped: "true"
            secrets_found: "1"

  - it: should leave the suite level object untouched for the next test
    kubernetesProvider:
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: extra-secret
            namespace: default
          stringData:
            other: other value
    asserts:
      - equal:
          path: stringData.from_string_data
          value: plain value
      - equal:
          path: stringData.string_data_is_dropped
          value: "true"
      - equal:
          path: stringData.secrets_found
          value: "2"
