suite: test secret parse assertions
templates:
  - secret.yaml
tests:
  - it: should decode base64 before parsing
    asserts:
      - equal:
          path: data.config
          decodeBase64: true
          parse: json
          innerPath: server.port
          value: 8080
      - notEqual:
          path: data.config
          decodeBase64: true
          parse: json
          innerPath: server.port
          value: 9999
