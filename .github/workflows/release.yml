on:
  workflow_call:
    inputs:
      run_release_job:
        description: "Run release artifact job"
        required: true
        type: boolean
      oci_push_enabled:
        description: "Whether to push signed package to OCI"
        required: true
        type: boolean
      oci_tag_suffix:
        description: "Optional OCI tag suffix, e.g. -alpha"
        required: false
        type: string
        default: ""
      oci_tag_latest:
        description: "Whether to tag OCI image as latest"
        required: true
        type: boolean
      publish_release_artifacts:
        description: "Whether to publish GitHub release artifacts"
        required: true
        type: boolean
      helm_tags_per_page:
        description: "How many Helm tags to fetch"
        required: false
        type: number
        default: 4
      plugin_tags_per_page:
        description: "How many plugin tags to fetch"
        required: false
        type: number
        default: 2
      run_docker_publish:
        description: "Run docker build and merge jobs"
        required: true
        type: boolean
    secrets:
      GPG_KEYRING_BASE64:
        description: "Base64 encoded GPG keyring for signing, required for signing test workflow"
        required: false
      GPG_PASSPHRASE_BASE64:
        description: "Base64 encoded GPG passphrase for signing, required for signing test workflow"
        required: false
      DOCKERHUB_TOKEN:
        description: "Docker Hub token for pushing images, required for docker publish test workflow"
        required: false

env:
  PACKAGE_REGISTRY: ghcr.io
  REGISTRY_IMAGE: helmunittest/helm-unittest
  HELM_REPO: helm/helm
  PLUGIN_REPO: helm-unittest/helm-unittest
  GO_VERSION: 1.26.x
  HELM_VERSION: "4.2.1"

permissions:
  contents: read

jobs:
  release:
    name: create distribution and upload to release
    if: ${{ inputs.run_release_job }}
    permissions:
      contents: write # to publish assets to the release
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: setup go
        # https://github.com/actions/setup-go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: setup helm 4
        # https://github.com/Azure/setup-helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: setup ORAS
        # https://github.com/oras-project/setup-oras
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0

      - name: login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.PACKAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: retrieve plugin info
        id: plugin
        shell: bash
        run: |
          PLUGIN_NAME=$(sed -n -e 's/name:[ "]*\([^"]*\).*/\1/p' plugin.yaml)
          PLUGIN_VERSION=$(sed -n -e 's/version:[ "]*\([^"]*\).*/\1/p' plugin.yaml)
          echo "name=$PLUGIN_NAME" >> $GITHUB_OUTPUT
          echo "version=$PLUGIN_VERSION" >> $GITHUB_OUTPUT

      - name: setup secrets for signing
        env:
          HELM_GPG_PRIVATE_KEY: ${{ secrets.GPG_KEYRING_BASE64 }}
          HELM_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE_BASE64 }}
        run: |
          printf '%s' "${{ env.HELM_GPG_PRIVATE_KEY }}" | base64 --decode > .secring.gpg
          printf '%s' "${{ env.HELM_GPG_PASSPHRASE }}" | base64 --decode > .passphrase
          gpg --import --batch --pinentry-mode=loopback --passphrase-file .passphrase .secring.gpg
          
      - name: make and sign distribution
        shell: bash
        run: make sign-dist

      - name: clean up secrets
        if: always()
        env:
          HELM_GPG_FINGERPRINT: ${{ vars.GPG_FINGERPRINT }}
        run: |
          test -f .secring.gpg && shred -u .secring.gpg
          test -f .passphrase && shred -u .passphrase
          if [ -n "${{ env.HELM_GPG_FINGERPRINT }}" ]; then
            gpg --batch --yes --delete-secret-keys ${{ env.HELM_GPG_FINGERPRINT }} || true
            gpg --batch --yes --delete-keys ${{ env.HELM_GPG_FINGERPRINT }} || true
          fi

      - name: push to OCI registry
        if: ${{ inputs.oci_push_enabled }}
        run: |
          cd _dist
          oras push $NAME \
            --artifact-type application/vnd.helm.plugin.v1+json \
            $PACKAGE \
            $PACKAGE.prov
          if [[ "${{ inputs.oci_tag_latest }}" == "true" ]]; then
            oras tag $NAME latest
          fi
        env:
          PACKAGE: "${{ steps.plugin.outputs.name }}-${{ steps.plugin.outputs.version }}.tgz"
          NAME: "${{ env.PACKAGE_REGISTRY }}/${{ github.repository }}/${{ steps.plugin.outputs.name }}:${{ steps.plugin.outputs.version }}${{ inputs.oci_tag_suffix }}"

      - name: publish artifacts
        if: ${{ inputs.publish_release_artifacts }}
        # https://github.com/softprops/action-gh-release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: _dist/**

  determine-versions:
    name: determine latest version of helm and helm-unittest plugin
    if: ${{ always() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    needs:
      - release
    outputs:
      HELM_VERSIONS: ${{ steps.helm-versions.outputs.helmversions }}
      HELM_PLUGIN_VERSIONS: ${{ steps.helm-plugin-versions.outputs.helmpluginversions }}
      HELM_LATEST_VERSION: ${{ steps.helm-versions.outputs.helmlatestversion }}
      HELM_PLUGIN_LATEST_VERSION: ${{ steps.helm-plugin-versions.outputs.helmpluginlatestversion }}
    steps:
      - id: helm-versions
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helmLatest=`curl --proto "=https" -sL -H "Authorization: token $TOKEN" https://api.github.com/repos/${{ env.HELM_REPO }}/tags?per_page=${{ inputs.helm_tags_per_page }} |jq -r ".[].name"|sed 's/^v//'|sort -V |grep -v -`
          echo "helmversions=$(printf '%s\n' ${helmLatest[@]} | jq -R . | jq -cs .)" >> $GITHUB_OUTPUT
          echo "helmlatestversion=$(printf '%s\n' ${helmLatest[@]} | jq -R . | jq -cs .[-1])" >> $GITHUB_OUTPUT
      - id: helm-plugin-versions
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pluginLatest=`curl --proto "=https" -sL -H "Authorization: token $TOKEN" https://api.github.com/repos/${{ github.repository }}/tags?per_page=${{ inputs.plugin_tags_per_page }} |jq -r ".[].name"|sed 's/^v//'|sort -V |grep -v -`
          echo "helmpluginversions=$(printf '%s\n' ${pluginLatest[@]} | jq -R . | jq -cs .)" >> $GITHUB_OUTPUT
          echo "helmpluginlatestversion=$(printf '%s\n' ${pluginLatest[@]} | jq -R . | jq -cs .[-1])" >> $GITHUB_OUTPUT

  release-docker:
    name: create multi-arch docker images and upload to dockerhub
    if: ${{ always() && (needs.determine-versions.result == 'success') && inputs.run_docker_publish }}
    permissions:
      contents: write # to publish assets to the release
    runs-on: ubuntu-24.04
    environment: HELMUNITTEST-RELEASE
    needs:
      - determine-versions
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/s390x, linux/ppc64le]
        helmVersion: ${{ fromJson(needs.determine-versions.outputs.HELM_VERSIONS) }}
        pluginVersion: ${{ fromJson(needs.determine-versions.outputs.HELM_PLUGIN_VERSIONS) }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          version=${{ matrix.helmVersion }}-${{ matrix.pluginVersion }}
          echo "PLATFORM_PAIR=${version}-${platform//\//-}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        # https://github.com/docker/metadata-action
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: ${{ matrix.helmVersion }}-${{ matrix.pluginVersion }}

      - name: Set up QEMU
        # https://github.com/docker/setup-qemu-action
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        # https://github.com/docker/setup-buildx-action
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Hub
        # https://github.com/docker/login-action
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        # https://github.com/docker/build-push-action
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          build-args: |
            HELM_VERSION=${{ matrix.helmVersion }}
            PLUGIN_VERSION=${{ matrix.pluginVersion }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  merge:
    if: ${{ always() && (needs.release-docker.result == 'success') && inputs.run_docker_publish }}
    permissions:
      contents: read # to download assets from the release
    runs-on: ubuntu-24.04
    environment: HELMUNITTEST-RELEASE
    needs:
      - determine-versions
      - release-docker
    strategy:
      fail-fast: false
      matrix:
        helmVersion: ${{ fromJson(needs.determine-versions.outputs.HELM_VERSIONS) }}
        pluginVersion: ${{ fromJson(needs.determine-versions.outputs.HELM_PLUGIN_VERSIONS) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.helmVersion }}-${{ matrix.pluginVersion }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        env:
          HELM_LATEST: ${{ fromJson(needs.determine-versions.outputs.HELM_LATEST_VERSION) }}
          PLUGIN_LATEST: ${{ fromJson(needs.determine-versions.outputs.HELM_PLUGIN_LATEST_VERSION) }}
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            ${{ matrix.helmVersion }}-${{ matrix.pluginVersion }}
            type=raw,value=latest,enable=${{ (matrix.helmVersion == env.HELM_LATEST) && (matrix.pluginVersion == env.PLUGIN_LATEST) }}

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
